name: Android-App bauen

on:
  push:
    branches: [main]
    paths: ['www/**', 'android/**', 'package*.json', 'capacitor.config.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Abhängigkeiten
        run: npm ci

      - name: Web-App in die Android-App kopieren
        run: npx cap sync android

      - name: Signaturschlüssel bereitstellen
        id: schluessel
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "datei=$RUNNER_TEMP/release.p12" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Kein Signaturschlüssel hinterlegt – es wird eine Debug-Version gebaut. Updates müssen dann neu installiert werden."
          fi

      - name: APK bauen
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ steps.schluessel.outputs.datei }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }}
            cp app/build/outputs/apk/release/app-release.apk ../immobilien-assistent.apk
          else
            ./gradlew --no-daemon assembleDebug -PversionCode=${{ github.run_number }}
            cp app/build/outputs/apk/debug/app-debug.apk ../immobilien-assistent.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: immobilien-assistent-apk
          path: immobilien-assistent.apk

      - name: Als Download veröffentlichen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" immobilien-assistent.apk \
            --title "Immobilien-Assistent $TAG" \
            --notes "Android-App zum Installieren: immobilien-assistent.apk herunterladen und öffnen. Stand: ${{ github.sha }}" \
            --latest
